name: Japanese font verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: japanese-fonts-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=3072
  DSH_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay

jobs:
  fonts:
    name: fonts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install regional fonts on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install browsers and system libraries on Linux
        if: runner.os == 'Linux'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium firefox webkit
      - name: Install browsers on macOS
        if: runner.os == 'macOS'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium firefox webkit
      - name: Build and check the application
        id: build
        run: |
          pnpm run build:artifacts --serial
          pnpm run build:check --serial
      - name: Verify regional glyphs in Chromium, Firefox and WebKit
        env:
          DSH_FONT_BROWSERS: chromium,firefox,webkit
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/regional-fonts.e2e.ts --maxWorkers=1
      - name: Replay the Japanese Web conversation
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/japanese-fonts.e2e.ts --maxWorkers=1
      - name: Replay recorded text and parallel tool calls through the CLI
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        env:
          DSH_EXAMPLE_MODE: lib
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: |
          mkdir -p output/japanese-fonts
          pnpm run test:snapshot snapshots/session/headless.snapshot.ts \
            -t 'replays (text-turn|parallel-tool-calls) ' \
            --reporter=default --reporter=json --outputFile.json=output/japanese-fonts/recorded-sessions.json
          node -e 'const report = require("./output/japanese-fonts/recorded-sessions.json"); require("node:assert/strict").equal(report.numPassedTests, 2)'
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: japanese-fonts-${{ matrix.os }}
          path: output/japanese-fonts
          if-no-files-found: warn
          retention-days: 14
